server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Location relativo nos redirects (os das páginas em espera, abaixo): o
    # absoluto sai com a porta e o esquema que o nginx enxerga — atrás de proxy
    # ou de TLS terminado antes dele, apontaria para http:// ou para a porta errada.
    absolute_redirect off;

    # Cabeçalhos de segurança (o legado não enviava nenhum).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Site institucional pré-renderizado (scripts/prerender.mjs): /sobre é
    # sobre.html. URL desconhecida responde 404 de verdade, com o 404.html —
    # um 200 com a home seria "soft 404" para o buscador.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    error_page 404 /404.html;

    # Páginas em espera desde 12/11/2026 (src/rotas-publicas.tsx): o site é só a
    # home, e o link antigo cai na seção. 302, não 301 — elas vão voltar.
    location = /sobre { return 302 /#sobre; }
    location = /servicos { return 302 /#servicos; }
    location = /contato { return 302 /#contato; }

    # Rotas do painel: shell vazio da SPA (app.html), e o React Router resolve.
    # A lista é a mesma dos rewrites do vercel.json — src/rotas.test.ts confere
    # as duas contra o router.
    location ~ ^/(login|esqueci-senha|redefinir-senha|sem-permissao|dashboard|certificacoes|certificados|nao-conformidades|processos|clientes|trilhas|categorias|equipe|relatorios)(/|$) {
        try_files /app.html =404;
    }

    location /img/ {
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
    }

    # Assets com hash no nome podem ser cacheados agressivamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API e uploads são servidos pelo backend.
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:3000/uploads/;
        proxy_set_header Host $host;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
