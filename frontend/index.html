<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0076a8" />
    <meta
      name="description"
      content="ProCert — Organismo de Certificação de Produto especializado em Equipamentos de Proteção Individual (EPIs). Certificação, auditorias e ensaios com rigor técnico."
    />
    <link rel="icon" href="/img/favicon.png" />

    <!-- Imagem do hero: numa SPA ela só entra no DOM depois que o bundle
         baixa e o React monta, então o navegador a descobre tarde. O preload
         antecipa o pedido para o começo do documento, em paralelo com o JS.
         É o elemento de maior área na primeira tela — ou seja, o LCP.

         Condicional, e por isso um script em vez de um <link> fixo: este mesmo
         index.html é servido em TODAS as rotas pelo rewrite de SPA do
         vercel.json, e o hero só existe na home (secoes/Hero.tsx). Fixo, ele
         baixava 218 KB com prioridade alta em toda tela do painel, disputando
         banda com o bundle para nada — e o Chrome avisava no console
         ("preloaded using link preload but not used"). O script é inline e roda
         na análise do <head>, antes de qualquer recurso bloqueante, então o
         pedido na home continua saindo tão cedo quanto saía com o <link>. -->
    <script>
      if (location.pathname === '/') {
        var preloadHero = document.createElement('link');
        preloadHero.rel = 'preload';
        preloadHero.as = 'image';
        preloadHero.href = '/img/hero-bg.jpg';
        preloadHero.setAttribute('fetchpriority', 'high');
        document.head.appendChild(preloadHero);
      }
    </script>
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />

    <!-- Tipografia do site institucional (Roboto/Raleway/Poppins, como no legado).
         Inter entra por conta do painel: a página de Aparência deixa o admin
         escolher a fonte, e uma opção que não carrega cairia em fallback sem
         avisar. Raleway continua exclusiva da home. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;700&family=Raleway:wght@400;500;700&family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />

    <title>ProCert · Certificação de Produtos</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
