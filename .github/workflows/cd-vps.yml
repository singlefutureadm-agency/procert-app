# Entrega contínua — publica `prod` no VPS da Locaweb.
#
# Dispara quando o CI termina VERDE num push em `prod`: o mesmo commit que
# passou nos testes é o que vai ao ar. `prod` só recebe código por PR (ruleset),
# então o caminho é sempre main → qa → prod → este workflow.
#
# O build acontece AQUI, não no servidor: o VPS não consegue baixar do npm
# (≈46 KB/s com ETIMEDOUT, medido em 12/11/2026). O runner é Ubuntu 24.04 como
# o VPS — mesma glibc e mesmo OpenSSL 3, então os binários nativos do
# node_modules (engines do Prisma, bcrypt) servem lá sem recompilar.
#
# O envio é rsync incremental para /opt/procert/staging: cada deploy manda só o
# que mudou. Pacote inteiro não passa — a rede até o VPS corta transferência
# longa e depois bloqueia o IP de origem (medido em 12/11/2026).
#
# Do lado do servidor quem age é `deploy/vps/procert-deploy.sh`, comando forçado
# da chave: ela não abre shell. Segredos (Settings → Secrets → Actions):
#   VPS_HOST      IP do servidor — fora do repositório, que é público
#   VPS_HOST_KEY  linha do known_hosts (`ssh-keyscan -t ed25519 <ip>`), fixa a
#                 identidade do servidor e impede ataque de intermediário
#   VPS_SSH_KEY   chave privada de deploy (a pública está no authorized_keys)
name: CD VPS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [prod]
  # Republicar a ponta de `prod` sem novo commit (ex.: VPS recriado).
  workflow_dispatch:

# Dois deploys simultâneos trocariam diretórios um debaixo do outro. Enfileira,
# nunca cancela: cancelar no meio da troca deixaria o servidor pela metade.
concurrency:
  group: cd-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publicar:
    name: Publicar no VPS
    # workflow_run também dispara para CI vermelho e para PR — só segue com
    # push verde. O dispatch manual só vale a partir de `prod`.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/prod')
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # node_modules inteiro, com as dependências de desenvolvimento: o
      # `prisma migrate deploy` roda no servidor e o CLI do Prisma é devDependency.
      - name: Build do backend
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npx nest build -p tsconfig.build.json

      # `/api` relativo: no VPS o nginx serve o painel e a API na mesma origem.
      - name: Build do frontend
        working-directory: frontend
        env:
          VITE_API_URL: /api
        run: |
          npm ci
          npm run build

      # Mesma forma do diretório de preparação no servidor: release/backend e
      # release/dist.
      - name: Montar a versão
        run: |
          mkdir -p release
          rsync -a --exclude=/src --exclude=/test --exclude=/.env backend/ release/backend/
          rsync -a frontend/dist/ release/dist/
          du -sh release

      # A linha do known_hosts é remontada aqui: do secret só se aproveitam o
      # tipo e a chave, e o host vem de VPS_HOST. Colado pela interface, o
      # secret pode chegar sem o IP na frente, com `\r` ou espaço sobrando — e o
      # ssh recusa com "No ED25519 host key is known" (primeiro deploy,
      # 12/11/2026). O fingerprint impresso deixa o log conferível.
      - name: Configurar SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          host=$(printf '%s' "$VPS_HOST" | tr -d '[:space:]')
          # Aparado, o valor deixa de ser idêntico ao secret e o GitHub não o
          # mascararia sozinho — e o log de um repositório público é público.
          echo "::add-mask::$host"
          chave=$(printf '%s\n' "$VPS_HOST_KEY" | tr -d '\r' | grep -oE 'ssh-ed25519 +[A-Za-z0-9+/=]+' | head -1)
          [ -n "$host" ] && [ -n "$chave" ] || { echo "VPS_HOST ou VPS_HOST_KEY vazio ou ilegível"; exit 1; }
          echo "$host $chave" > ~/.ssh/known_hosts
          echo "VPS=$host" >> "$GITHUB_ENV"
          ssh-keygen -l -f ~/.ssh/known_hosts

      - name: Enviar e instalar
        env:
          COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o StrictHostKeyChecking=yes"
          # Só o que mudou desde o deploy anterior, numa conexão. Cortada no
          # meio, a próxima tentativa retoma (--partial). O intervalo longo é de
          # propósito: depois de um corte a rede da Locaweb recusa o IP de
          # origem por alguns minutos, e tentar antes só prolonga o bloqueio.
          # COMMIT vai por último, num segundo rsync: é o sinal, para o
          # servidor, de que a sincronização terminou inteira.
          sincronizar() {
            rsync -az --delete --partial --stats -e "$SSH" release/ "root@$VPS:" &&
            echo "$COMMIT" > COMMIT &&
            rsync -a -e "$SSH" COMMIT "root@$VPS:COMMIT"
          }
          for tentativa in 1 2 3 4 5 6; do
            sincronizar && break
            [ "$tentativa" = 6 ] && { echo "rsync falhou 6 vezes"; exit 1; }
            echo "rsync: tentativa $tentativa falhou, nova tentativa em 120 s"
            sleep 120
          done
          $SSH "root@$VPS" instala "$COMMIT"

      - name: Remover a chave do runner
        if: always()
        run: rm -f ~/.ssh/deploy
